<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jeu des Taupes</title>
<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: #e9e9e9;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

#score {
  font-size: 24px;
  margin: 10px 0;
}

#game-area {
  width: 90%;
  max-width: 600px;
  height: 400px;
  background: #c2a878;
  margin: auto;
  border-radius: 20px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(2, 1fr);
  padding: 20px;
  gap: 10px;
  position: relative;
}

.hole {
  background: #8b5a2b;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
}

.mole {
  width: 80%;
  left: 50%;
  transform: translateX(-50%);
  position: absolute;
  bottom: -100%;
  transition: bottom 0.25s;
  cursor: pointer;
  user-select: none;
}

#win-screen {
  display: none;
  padding: 40px;
}

#change-page-btn {
  padding: 10px 20px;
  font-size: 18px;
  cursor: pointer;
}
</style>
</head>
<body>
<h1>Jeu des Taupes</h1>
<div id="score">Score : 0</div>
<div id="game-area"></div>
<div id="win-screen">
  <h2>Tu as gagné !</h2>
  <button id="change-page-btn">Changer de page</button>
</div>
<script>
const scoreEl = document.getElementById('score');
const gameArea = document.getElementById('game-area');
const winScreen = document.getElementById('win-screen');
const changePageBtn = document.getElementById('change-page-btn');

let score = 0;
let active = true;

// Création des trous + taupes
for (let i = 0; i < 6; i++) {
  const hole = document.createElement('div');
  hole.className = 'hole';

  const mole = document.createElement('img');
  mole.src = 'Snapchat-1968011516.jpg'; // Image dans le même dossier que le HTML
  mole.className = 'mole';

  hole.appendChild(mole);
  gameArea.appendChild(hole);
}

const moles = document.querySelectorAll('.mole');

function popMole() {
  if (!active) return;
  const mole = moles[Math.floor(Math.random() * moles.length)];
  mole.style.bottom = '0%';
  setTimeout(() => { mole.style.bottom = '-100%'; }, 800);
}

moles.forEach(mole => {
  mole.addEventListener('click', () => {
    if (!active) return;
    mole.style.bottom = '-100%';
    score += 50;
    scoreEl.innerText = 'Score : ' + score;
    if (score >= 500) {
      active = false;
      winScreen.style.display = 'block';
    }
  });
});

setInterval(popMole, 900);

// Changer de page avec image carrée et lien YouTube optimisé mobile
changePageBtn.addEventListener('click', () => {
  document.body.innerHTML = `
    <div style="padding:20px; text-align:center; display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:100vh;">
      <h1>La page de Habib</h1>
      <a href="https://www.youtube.com/shorts/EpvJN-r2XqQ" target="_blank">
        <img src="Snapchat-1968011516.jpg" style="width:80vw; max-width:300px; height:80vw; max-height:300px; object-fit:cover; cursor:pointer; border-radius:10px;" />
      </a>
      <p style="margin-top:20px; font-size:18px; color:red;">À ne pas cliquer</p>
    </div>
  `;
});
</script>
</body>
</html>
